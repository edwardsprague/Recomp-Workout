<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#F5F3EE" />
<title>Workout Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --paper: #F5F3EE;
    --surface: #FFFFFF;
    --ink: #26251F;
    --ink-soft: #5C5A50;
    --mute: #9C9A8E;
    --line: #E6E2D6;
    --accent: #57594E;
    --accent-soft: #E7E5DC;
    --gold: #A08A5E;
    --success: #6B7A62;
    --success-soft: #E9EBE3;
    --danger: #9C6A52;
    --danger-soft: #EEE4DC;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .disp { font-family: 'Space Grotesk', sans-serif; }

  #app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 20px 16px 12px; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .eyebrow { font-size: 10px; letter-spacing: 0.2em; color: var(--mute); font-weight: 500; margin: 0 0 2px; }
  .day-title { font-size: 18px; font-weight: 600; margin: 0; }
  .day-subtitle { font-size: 12px; color: var(--ink-soft); margin: 2px 0 0; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .streak-pill { display: flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 10px; background: var(--accent-soft); }
  .streak-pill span { font-size: 12px; font-weight: 600; color: var(--accent); }
  .week-pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .date-row { display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 12px; background: var(--paper); border: 1px solid var(--line); margin-bottom: 8px; }
  .date-row input[type="date"] { background: transparent; border: none; font-size: 12px; font-weight: 500; color: var(--ink); flex: 1; font-family: inherit; }
  .week-picker { background: transparent; border: none; font-size: 12px; font-weight: 500; color: var(--ink); flex: 1; font-family: inherit; padding: 0; }
  .save-indicator { font-size: 10px; font-weight: 500; color: var(--mute); white-space: nowrap; }
  .save-indicator.saved { color: var(--success); }
  details.cycle-details { font-size: 10px; color: var(--mute); }
  details.cycle-details summary { cursor: pointer; user-select: none; }
  .cycle-edit-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .cycle-edit-row input[type="date"] { border-radius: 4px; padding: 2px 6px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); font-family: inherit; font-size: 10px; }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 12px 12px 16px; }

  .role-banner { border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .role-banner .role-label { font-size: 12px; font-weight: 600; margin: 0 0 2px; }
  .role-banner .role-detail { font-size: 12px; color: var(--ink-soft); margin: 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .card-pad { padding: 16px; }

  /* WARMUP */
  .warmup-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: none; border: none; cursor: pointer; font: inherit; color: var(--ink); }
  .warmup-toggle span { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .warmup-body { padding: 0 16px 16px; border-top: 1px solid var(--line); display: none; }
  .warmup-body.open { display: block; }
  .warmup-item { font-size: 12px; color: var(--ink-soft); padding-top: 6px; }
  .warmup-item b { color: var(--ink); font-weight: 500; }

  /* EXERCISE CARD */
  .ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ex-name { font-size: 14px; font-weight: 600; margin: 0; line-height: 1.3; }
  .room-badge { display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); }
  .ex-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .history-btn, .video-btn { background: none; border: none; color: var(--mute); cursor: pointer; padding: 4px; flex-shrink: 0; display: inline-flex; }
  .video-btn { color: var(--accent); text-decoration: none; }

  .lastweek-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 5px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft); margin-bottom: 8px; }
  .lastweek-chip b { color: var(--ink); font-weight: 500; }

  .ref-row { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .ref-row b { color: var(--ink); }
  .ex-note { font-size: 12px; color: var(--mute); margin: 0 0 12px; line-height: 1.4; }

  .goal-box { border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--accent-soft); }
  .goal-box .goal-label { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
  .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }

  .warmup-ramp-box { border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #F1EAD9; border: 1px solid var(--gold); }
  .warmup-ramp-box .warmup-ramp-label { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); }
  .warmup-ramp-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); padding: 4px 0; }
  .warmup-ramp-row b { color: var(--ink); font-weight: 600; min-width: 44px; }
  .warmup-ramp-pct { margin-left: auto; color: var(--mute); font-size: 10px; }
  .warmup-ramp-work { border-top: 1px dashed var(--gold); margin-top: 4px; padding-top: 6px; }
  .warmup-ramp-work b { color: var(--gold); }
  .warmup-ramp-empty { font-size: 11px; color: var(--mute); margin: 6px 0 0; }
  .field-label { font-size: 10px; color: var(--ink-soft); display: block; margin-bottom: 2px; }
  .field-label.mute { color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }

  .stepper { display: flex; align-items: center; border-radius: 6px; overflow: hidden; border: 1px solid var(--accent); background: var(--surface); }
  .stepper button { border: none; background: var(--surface); color: var(--accent); padding: 8px 12px; cursor: pointer; font-size: 14px; line-height: 1; }
  .stepper .val { flex: 1; text-align: center; font-size: 13px; font-weight: 600; }

  .weight-stepper { display: flex; align-items: center; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .weight-stepper button { border: none; background: var(--paper); color: var(--accent); padding: 8px 12px; cursor: pointer; font-size: 14px; line-height: 1; }
  .weight-stepper .val { flex: 1; text-align: center; font-size: 13px; font-weight: 600; }

  .divider { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; }

  .goal-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .goal-toggle button { flex: 1; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--paper); color: var(--mute); border: 1px solid var(--line); font-family: inherit; }
  .goal-toggle button.active-hit { background: var(--success-soft); color: var(--success); border-color: var(--success); }
  .goal-toggle button.active-miss { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  select, input[type="text"], textarea {
    width: 100%; border-radius: 6px; padding: 8px; font-size: 13px; background: var(--paper);
    border: 1px solid var(--line); color: var(--ink); font-family: inherit;
  }
  textarea { resize: vertical; }

  .rest-static { font-size: 12px; color: var(--mute); }
  .rest-start-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    font-size: 12px; font-weight: 500; padding: 8px; border-radius: 6px; cursor: pointer;
    background: var(--paper); color: var(--accent); border: 1px solid var(--accent); font-family: inherit;
  }
  .rest-countdown { display: none; }
  .rest-countdown.active { display: block; }
  .rest-countdown-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .rest-status { font-size: 12px; font-weight: 500; color: var(--accent); }
  .rest-time { font-size: 13px; font-weight: 600; }
  .rest-bar-track { height: 4px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .rest-bar-fill { height: 100%; border-radius: 999px; background: var(--gold); width: 100%; transition: width 1s linear; }

  /* LISS + NOTES */
  .liss-banner { border-radius: 12px; padding: 16px; margin-bottom: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; line-height: 1.5; }
  .liss-banner p { margin: 0 0 4px; font-weight: 600; }

  /* TABS */
  .tabs { display: flex; gap: 6px; padding: 12px; background: var(--surface); border-top: 1px solid var(--line); }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
  .tab-badge { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
  .tab-label { font-size: 9px; font-weight: 500; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(38,37,31,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 16px 16px 0 0; padding: 16px; max-height: 75vh; overflow-y: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head h3 { font-size: 14px; font-weight: 600; margin: 0; }
  .modal-close { background: none; border: none; color: var(--mute); cursor: pointer; padding: 4px; }
  .hist-empty { font-size: 12px; color: var(--mute); }
  .hist-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; border-radius: 6px; padding: 8px 10px; background: var(--paper); margin-bottom: 6px; }
  .hist-date { color: var(--ink-soft); }
  .hist-val { color: var(--ink); }

  svg.icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
</style>

const REP_OPTIONS = [...Array.from({ length: 30 }, (_, i) => String(i + 1)), "Max", "Failure"];
const SET_OPTIONS = ["1", "2", "3", "4", "5"];
const DURATION_OPTIONS = ["15 sec", "30 sec", "45 sec", "1 min", "90 sec", "2 min", "3 min", "Max Hold"];
const DISTANCE_OPTIONS = ["20 yd", "40 yd", "60 yd", "80 yd", "100 yd", "0.5 mi", "1 mi", "1.5 mi", "2 mi"];
const CYCLE_LENGTH = 9;

/* ================================================================== */
/* HELPERS                                                              */
/* ================================================================== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function slug(dayId, name) {
  return dayId + "__" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function mondayOf(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d.toISOString().slice(0, 10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function diffDays(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function computeStreak(dateList) {
  if (!dateList.length) return 0;
  const weeks = new Set(dateList.map(mondayOf));
  let count = 0, cursor = mondayOf(todayStr());
  while (weeks.has(cursor)) { count++; cursor = addDays(cursor, -7); }
  return count;
}
function getCycleInfo(startDate, currentDate) {
  const weekIndexAbs = Math.floor(diffDays(startDate, currentDate) / 7);
  const cyclePos = ((weekIndexAbs % CYCLE_LENGTH) + CYCLE_LENGTH) % CYCLE_LENGTH;
  const week = cyclePos + 1;
  const cycleNumber = Math.floor(weekIndexAbs / CYCLE_LENGTH) + 1;
  const isRest = week === CYCLE_LENGTH;
  const block = isRest ? null : Math.ceil(week / 2);
  const role = isRest ? "rest" : (week % 2 === 1 ? "progress" : "hold");
  return { week, cycleNumber, isRest, block, role };
}
function roleMeta(info) {
  if (info.isRest) return { label: `Week ${info.week} of ${CYCLE_LENGTH} — Rest Week`, detail: "Deload. Drop to 1–2 light sets or take the week fully off. Prioritize sleep, mobility, and easy walking.", color: "var(--gold)", bg: "#F1EAD9" };
  if (info.role === "progress") return { label: `Week ${info.week} of ${CYCLE_LENGTH} — Block ${info.block} · New Numbers`, detail: info.week === 1 ? "Cycle start — set this block's baseline weight/reps for each lift." : "Adjust weight or reps up from last block based on how it felt. This sets the target for the next 2 weeks.", color: "var(--accent)", bg: "var(--accent-soft)" };
  return { label: `Week ${info.week} of ${CYCLE_LENGTH} — Block ${info.block} · Repeat`, detail: "Match last week's numbers. Check the reference below each lift before you load the bar.", color: "var(--ink-soft)", bg: "var(--paper)" };
}
function parseRestSeconds(rest) {
  if (!rest) return null;
  const m = rest.match(/(\d+)\s*min/), s = rest.match(/(\d+)\s*sec/);
  if (m) return parseInt(m[1], 10) * 60;
  if (s) return parseInt(s[1], 10);

}
function formatClock(t) { const m = Math.floor(t / 60), s = t % 60; return `${m}:${String(s).padStart(2, "0")}`; }
function weekdayToDayId() {
  const map = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  const id = map[new Date().getDay()];
  return PROGRAM.days.some((d) => d.id === id) ? id : "monday";
}
function weekdayOffset(dayId) {
  return PROGRAM.days.findIndex((d) => d.id === dayId); // monday=0 ... saturday=5
}
function defaultDateForDay(dayId) {
  const currentMonday = mondayOf(todayStr());

}
/* All 9 calendar dates (one per cycle week) that correspond to this weekday,
   anchored to the cycle start date. Used to populate the week-picker dropdown. */
function cycleWeekDatesForDay(dayId) {
  const cycleMonday = mondayOf(state.cycleStart);
  const offset = weekdayOffset(dayId);

  for (let i = 0; i < CYCLE_LENGTH; i++) dates.push(addDays(cycleMonday, offset + 7 * i));

}
function formatShortDate(dateStr) {

}
/* Forces any date onto the correct weekday for the given day tab. If someone
   free-picks a date via the native calendar (rather than the week dropdown)
   and it lands on the wrong weekday, this snaps it to the nearest date that
   actually falls on that weekday, so Monday's tab can never end up holding
   a Tuesday's date, etc. */
function snapToWeekday(dateStr, dayId) {
  const d = new Date(dateStr + "T00:00:00");
  const current = d.getDay(); // 0=Sun..6=Sat
  const target = weekdayOffset(dayId) + 1; // our days array is Mon(0)..Sat(5) -> JS 1..6

}
function showsWeight(ex) { return ex.weightLabel !== "Bodyweight"; }
function hasDuration(ex) { return !!ex.duration && !ex.reps; }
function hasDistance(ex) { return !!ex.distance; }

}

function defaultGoal(ex) {

    reps: ex.goalReps ?? (typeof ex.reps === "number" ? ex.reps : null),
    duration: matchOption(ex.duration, DURATION_OPTIONS),
    distance: ex.goalDistance ?? matchOption(ex.distance, DISTANCE_OPTIONS),

}
function findEx(dayId, name) {
  const day = PROGRAM.days.find((d) => d.id === dayId);
  return day.exercises.find((e) => e.name === name);
}
function isFirstWeightedExercise(dayId, exName) {
  const day = PROGRAM.days.find((d) => d.id === dayId);

}
/* Ramp-up warm-up protocol, based on published strength-training guidance
   (NSCA position stand on RT warm-ups; standard bench/squat/deadlift ramp

   ramp — roughly 60% x 7, 75% x 5, 87.5% x 3, then the working weight.

    { pct: 75, reps: 5, weight: roundTo5(w * 0.75) },
    { pct: 87.5, reps: 3, weight: roundTo5(w * 0.875) },

}
function renderWarmupRampHtml(workingWeight) {
  const ramp = calcWarmupRamp(workingWeight);

  return ramp.map((r, i) => `<div class="warmup-ramp-row"><span>Set ${i + 1}</span><b>${r.weight} lb</b><span>× ${r.reps} reps</span><span class="warmup-ramp-pct">(${r.pct}%)</span></div>`).join("")
    + `<div class="warmup-ramp-row warmup-ramp-work"><span>Work sets</span><b>${Math.round(workingWeight)} lb</b><span>× your reps</span><span></span></div>`;

const PREFIX = "ironheart::";
function sGet(key) { return localStorage.getItem(PREFIX + key); }
function sSet(key, val) { localStorage.setItem(PREFIX + key, val); }
function sKeysWithPrefix(p) {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(PREFIX + p)) out.push(k.slice(PREFIX.length));
  }
  return out;
}
function loadSession(dayId, date) {
  const raw = sGet(`session:${dayId}:${date}`);
  return raw ? JSON.parse(raw) : null;
}
function saveSession(dayId, date, payload) { sSet(`session:${dayId}:${date}`, JSON.stringify(payload)); }
function listSessionDates(dayId) { return sKeysWithPrefix(`session:${dayId}:`).map((k) => k.split(":").pop()); }
function loadAllSessions(dayId) {
  return listSessionDates(dayId).map((date) => ({ date, ...loadSession(dayId, date) })).sort((a, b) => (a.date < b.date ? 1 : -1));
}
function loadGoal(dayId, name) {
  const raw = sGet(`goal:${dayId}:${name}`);
  return raw ? JSON.parse(raw) : null;
}
function saveGoal(dayId, name, goal) { sSet(`goal:${dayId}:${name}`, JSON.stringify(goal)); }
function loadCycleStart() { return sGet("settings:cycleStart"); }
function saveCycleStart(d) { sSet("settings:cycleStart", d); }

/* ================================================================== */
/* STATE                                                                */
/* ================================================================== */
const state = {
  activeDayId: weekdayToDayId(),
  dates: {},
  logs: {},      // dayId -> { exercises: {name: log}, sessionNotes }
  goals: {},     // dayId -> { name: goal }
  prevWeek: {},  // name -> log (for active day/date)
  streaks: {},
  cycleStart: mondayOf(loadCycleStart() || todayStr()),
  saveState: "idle",
  timer: { key: null, intervalId: null, resetTimeoutId: null, secondsLeft: 0, total: 0 },
  warmupOpen: {},
};
PROGRAM.days.forEach((d) => { state.dates[d.id] = defaultDateForDay(d.id); });

let saveDebounce = null;
function persistSession() {
  state.saveState = "saving";
  updateSaveIndicator();
  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(() => {
    const dayId = state.activeDayId, date = state.dates[dayId];
    saveSession(dayId, date, state.logs[dayId] || { exercises: {}, sessionNotes: "" });
    state.saveState = "saved";
    updateSaveIndicator();
    state.streaks[dayId] = computeStreak(listSessionDates(dayId));
    const el = document.getElementById("streak-count");
    if (el) el.textContent = state.streaks[dayId] || 0;
  }, 400);
}
function updateSaveIndicator() {
  const el = document.getElementById("save-indicator");
  if (!el) return;
  el.textContent = state.saveState === "saving" ? "Saving…" : state.saveState === "saved" ? "Saved" : "";
  el.classList.toggle("saved", state.saveState === "saved");
}

function loadDayData(dayId) {
  const date = state.dates[dayId];
  const session = loadSession(dayId, date);
  state.logs[dayId] = session || { exercises: {}, sessionNotes: "" };

  const day = PROGRAM.days.find((d) => d.id === dayId);
  const goals = {};
  day.exercises.forEach((ex) => { goals[ex.name] = loadGoal(dayId, ex.name) || defaultGoal(ex); });
  state.goals[dayId] = goals;

  const prior = loadSession(dayId, addDays(date, -7));
  state.prevWeek = (prior && prior.exercises) || {};
}
function computeAllStreaks() {
  PROGRAM.days.forEach((d) => { state.streaks[d.id] = computeStreak(listSessionDates(d.id)); });
}

function activeDay() { return PROGRAM.days.find((d) => d.id === state.activeDayId); }

function renderExerciseCard(ex, dayId) {

function stepperHtml(s, target, field, value, step, suffix, min, weightSteps) {
  const v = value === null || value === undefined || value === "" ? 0 : Number(value);
  const stepsAttr = weightSteps ? `data-steps="${esc(JSON.stringify(weightSteps))}"` : "";
  return `<div class="stepper">

    <span class="val" id="val-${target}-${field}-${s}">${v} ${suffix}</span>
    <button type="button" data-action="stepper" data-dir="1" data-slug="${s}" data-target="${target}" data-field="${field}" data-step="${step}" data-min="${min}" data-suffix="${suffix}" ${stepsAttr}>+</button>
  </div>`;
}
function weightStepperHtml(s, value, weightSteps) {
  const v = value === null || value === undefined || value === "" ? 0 : Number(value);
  const stepsAttr = weightSteps ? `data-steps="${esc(JSON.stringify(weightSteps))}"` : "";
  return `<div class="weight-stepper">
    <button type="button" data-action="stepper" data-dir="-1" data-slug="${s}" data-target="log" data-field="weight" data-step="5" data-min="0" data-suffix="lb" ${stepsAttr}>−</button>
    <span class="val" id="val-log-weight-${s}">${v} lb</span>
    <button type="button" data-action="stepper" data-dir="1" data-slug="${s}" data-target="log" data-field="weight" data-step="5" data-min="0" data-suffix="lb" ${stepsAttr}>+</button>
  </div>`;
}
function nextStepValue(steps, current, dir) {
  const cur = current === null || current === undefined || current === "" ? 0 : Number(current);
  // find nearest index to current value, then move one step in that array
  let idx = steps.reduce((best, v, i) => (Math.abs(v - cur) < Math.abs(steps[best] - cur) ? i : best), 0);
  idx = Math.max(0, Math.min(steps.length - 1, idx + dir));
  return steps[idx];
}
function selectHtml(s, target, field, value, options, placeholder) {
  const opts = options.map((o) => `<option value="${esc(o)}" ${value === o ? "selected" : ""}>${esc(o)}</option>`).join("");
  return `<select data-target="${target}" data-field="${field}" data-slug="${s}">
    <option value="">${esc(placeholder)}</option>${opts}
  </select>`;
}

function renderApp() {
  const day = activeDay();
  const date = state.dates[day.id];
  const cycleInfo = getCycleInfo(state.cycleStart, date);
  const role = roleMeta(cycleInfo);

  const warmupHtml = day.warmup ? `
    <div class="card">
      <button type="button" class="warmup-toggle" data-action="toggle-warmup">
        <span>Warm-up</span>
        <span id="warmup-chevron">${state.warmupOpen[day.id] ? ICONS.chevronUp : ICONS.chevronDown}</span>
      </button>
      <div class="warmup-body ${state.warmupOpen[day.id] ? "open" : ""}" id="warmup-body">
        ${day.warmup.map((w) => `<div class="warmup-item"><b>${esc(w.name)}</b> — ${w.sets} × ${esc(w.reps || w.duration)}${w.note ? " (" + esc(w.note) + ")" : ""}</div>`).join("")}
      </div>
    </div>` : "";

  const exercisesHtml = day.exercises.map((ex) => renderExerciseCard(ex, day.id)).join("");

  const lissHtml = day.liss ? `<div class="liss-banner"><p class="disp">LISS finisher</p>${esc(day.liss)}</div>` : "";

  const log = state.logs[day.id] || { exercises: {}, sessionNotes: "" };
  const notesHtml = `<div class="card card-pad">
    <label class="field-label mute">Session notes</label>
    <textarea rows="3" data-target="log" data-field="sessionNotes" placeholder="Overall notes for today's session...">${esc(log.sessionNotes)}</textarea>
  </div>`;

  const tabsHtml = PROGRAM.days.map((d) => `
    <button type="button" class="tab-btn" data-action="switch-day" data-day="${d.id}">
      <div class="tab-badge" style="background:${d.id === state.activeDayId ? d.color : "transparent"}; color:${d.id === state.activeDayId ? "#fff" : d.color}; border:1.5px solid ${d.color};">${d.initial}</div>
      <div class="tab-label" style="color:${d.id === state.activeDayId ? d.color : "var(--mute)"};">${d.shortLabel}</div>
    </button>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <p class="eyebrow">WORKOUT PLAN</p>
          <h1 class="day-title disp">${esc(day.label)}</h1>
          <p class="day-subtitle">${esc(day.subtitle)}</p>
        </div>
        <div class="header-right">
          <div class="streak-pill">${ICONS.flame}<span id="streak-count">${state.streaks[day.id] || 0}</span></div>
          <span class="week-pill" style="background:${role.bg}; color:${role.color};">Wk ${cycleInfo.week}/${CYCLE_LENGTH}</span>
        </div>
      </div>
      <div class="date-row">
        ${ICONS.calendar}
        <input type="date" data-action="change-date" value="${date}" />
        <span class="save-indicator" id="save-indicator"></span>
      </div>
      <div class="date-row">
        <select data-action="change-date" class="week-picker">
          ${cycleWeekDatesForDay(day.id).map((d, i) => `<option value="${d}" ${d === date ? "selected" : ""}>Week ${i + 1} — ${formatShortDate(d)}${d === date ? " (current)" : ""}</option>`).join("")}
        </select>
      </div>
      <details class="cycle-details">
        <summary>Cycle start: ${state.cycleStart} · Cycle ${cycleInfo.cycleNumber}</summary>
        <div class="cycle-edit-row">
          <span>Change start date:</span>
          <input type="date" data-action="change-cycle-start" value="${state.cycleStart}" />
        </div>
      </details>
    </div>
    <div class="content">
      <div class="role-banner" style="background:${role.bg};">
        <p class="role-label disp" style="color:${role.color};">${role.label}</p>
        <p class="role-detail">${role.detail}</p>
      </div>
      ${warmupHtml}
      ${exercisesHtml}
      ${lissHtml}
      ${notesHtml}
    </div>
    <div class="tabs">${tabsHtml}</div>
  `;

  // Rest timer: if one is active for an exercise on this day, restore its visual state
  if (state.timer.key) {
    const btn = document.getElementById(`rt-btn-${state.timer.key}`);
    const countdown = document.getElementById(`rt-countdown-${state.timer.key}`);
    if (btn && countdown) {
      btn.style.display = "none";
      countdown.classList.add("active");
      updateTimerDisplay();
    }
  }
}

/* ================================================================== */
/* TIMER                                                                */
/* ================================================================== */
/* iOS Safari silently blocks audio that isn't started directly inside a
   user tap. Creating a fresh AudioContext inside the setInterval callback
   (i.e. when the timer actually finishes) is exactly that — an
   auto-triggered sound with no tap behind it — so it gets blocked more
   often than not. Fix: create ONE AudioContext up front, unlocked during
   the "Start rest timer" tap itself (a real user gesture), and reuse it
   for every beep from then on. */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    // Play a near-silent blip right now, inside the tap, to fully unlock audio on iOS.
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.00001, audioCtx.currentTime);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + 0.01);
  } catch (e) {}
}
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const ctx = audioCtx;
    const playTone = (startAt) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + startAt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + 0.3);
      o.start(ctx.currentTime + startAt);
      o.stop(ctx.currentTime + startAt + 0.32);
    };
    playTone(0);
    playTone(0.4);
    playTone(0.8);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
}
function updateTimerDisplay() {
  const s = state.timer.key;
  const timeEl = document.getElementById(`rt-time-${s}`);
  const barEl = document.getElementById(`rt-bar-${s}`);
  const statusEl = document.getElementById(`rt-status-${s}`);
  if (!timeEl || !barEl || !statusEl) return;
  const secondsLeft = Math.max(0, state.timer.secondsLeft);
  timeEl.textContent = formatClock(secondsLeft);
  barEl.style.width = Math.max(0, Math.min(100, (secondsLeft / state.timer.total) * 100)) + "%";
  if (secondsLeft > 0) {
    statusEl.textContent = "Resting";
    statusEl.style.color = "var(--accent)";
    barEl.style.background = "var(--gold)";
  } else {
    statusEl.textContent = "Rest done";
    barEl.style.background = "var(--success)";
  }
}
function resetTimerWidget(s) {
  const btn = document.getElementById(`rt-btn-${s}`);
  const countdown = document.getElementById(`rt-countdown-${s}`);
  if (btn) btn.style.display = "";
  if (countdown) countdown.classList.remove("active");
  if (state.timer.key === s) {
    state.timer.key = null;
    state.timer.secondsLeft = 0;
    state.timer.total = 0;
  }
}
function startTimer(newSlug, seconds) {
  if (state.timer.key && state.timer.key !== newSlug) {
    resetTimerWidget(state.timer.key);
  }
  clearInterval(state.timer.intervalId);
  clearTimeout(state.timer.resetTimeoutId);
  state.timer.key = newSlug;
  state.timer.secondsLeft = seconds;
  state.timer.total = seconds;

  const btn = document.getElementById(`rt-btn-${newSlug}`);
  const countdown = document.getElementById(`rt-countdown-${newSlug}`);
  if (btn) btn.style.display = "none";
  if (countdown) countdown.classList.add("active");
  updateTimerDisplay();

  state.timer.intervalId = setInterval(() => {
    state.timer.secondsLeft -= 1;
    if (state.timer.secondsLeft <= 0) {
      clearInterval(state.timer.intervalId);
      state.timer.secondsLeft = 0;
      beep();
      updateTimerDisplay();
      state.timer.resetTimeoutId = setTimeout(() => resetTimerWidget(newSlug), 2500);
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

/* ================================================================== */
/* HISTORY MODAL                                                       */
/* ================================================================== */
function openHistory(dayId, exerciseName) {
  const sessions = loadAllSessions(dayId);
  const rows = sessions
    .map((s) => ({ date: s.date, entry: s.exercises && s.exercises[exerciseName] }))
    .filter((r) => r.entry && (r.entry.weight || r.entry.reps || r.entry.duration || r.entry.distance));

  const rowsHtml = rows.length === 0
    ? `<p class="hist-empty">No logged history yet for this exercise.</p>`
    : rows.map((r) => `
        <div class="hist-row">
          <span class="hist-date">${esc(r.date)}</span>
          <span class="hist-val">
            ${r.entry.weight ? esc(r.entry.weight) + " lb  " : ""}${r.entry.reps ? "× " + esc(r.entry.reps) + "  " : ""}${esc(r.entry.duration || "")}${esc(r.entry.distance || "")}${r.entry.sets ? "  (" + esc(r.entry.sets) + " sets)" : ""}
            ${r.entry.goalHit === true ? ICONS.check : r.entry.goalHit === false ? ICONS.x : ""}
          </span>
        </div>`).join("");

  const modal = document.createElement("div");
  modal.className = "modal-backdrop";
  modal.setAttribute("data-action", "close-history-backdrop");
  modal.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="disp">${esc(exerciseName)}</h3>
        <button type="button" class="modal-close" data-action="close-history">${ICONS.x}</button>
      </div>
      ${rowsHtml}
    </div>`;
  document.getElementById("app").appendChild(modal);
}

/* ================================================================== */
/* EVENT DELEGATION                                                    */
/* ================================================================== */
const app = document.getElementById("app");

app.addEventListener("click", (e) => {
  const backdrop = e.target.closest('[data-action="close-history-backdrop"]');
  if (backdrop && e.target === backdrop) { backdrop.remove(); return; }

  const closeBtn = e.target.closest('[data-action="close-history"]');
  if (closeBtn) { closeBtn.closest(".modal-backdrop").remove(); return; }

  const histBtn = e.target.closest('[data-action="open-history"]');
  if (histBtn) { openHistory(state.activeDayId, histBtn.dataset.name); return; }

  const tabBtn = e.target.closest('[data-action="switch-day"]');
  if (tabBtn) {
    state.activeDayId = tabBtn.dataset.day;
    loadDayData(state.activeDayId);
    renderApp();
    return;
  }

  const warmupToggle = e.target.closest('[data-action="toggle-warmup"]');
  if (warmupToggle) {
    state.warmupOpen[state.activeDayId] = !state.warmupOpen[state.activeDayId];
    document.getElementById("warmup-body").classList.toggle("open");
    document.getElementById("warmup-chevron").innerHTML = state.warmupOpen[state.activeDayId] ? ICONS.chevronUp : ICONS.chevronDown;
    return;
  }

  const timerBtn = e.target.closest('[data-action="start-timer"]');
  if (timerBtn) { unlockAudio(); startTimer(timerBtn.dataset.slug, parseInt(timerBtn.dataset.seconds, 10)); return; }

  const goalHitBtn = e.target.closest('[data-action="goal-hit"], [data-action="goal-miss"]');
  if (goalHitBtn) {
    const dayId = state.activeDayId;
    const wrapper = goalHitBtn.closest(".goal-toggle");
    const hitBtn = wrapper.querySelector('[data-action="goal-hit"]');
    const missBtn = wrapper.querySelector('[data-action="goal-miss"]');
    const isHit = goalHitBtn.dataset.action === "goal-hit";
    const card = goalHitBtn.closest(".card");
    const realName = card.querySelector(".ex-name").textContent;
    const log = (state.logs[dayId].exercises[realName] = state.logs[dayId].exercises[realName] || emptyLog());
    const newVal = isHit ? (log.goalHit === true ? null : true) : (log.goalHit === false ? null : false);
    log.goalHit = newVal;
    hitBtn.classList.toggle("active-hit", newVal === true);
    missBtn.classList.toggle("active-miss", newVal === false);
    persistSession();
    return;
  }

  const stepperBtn = e.target.closest('[data-action="stepper"]');
  if (stepperBtn) {
    const { slug: s, target, field, step, min, suffix, dir, steps } = stepperBtn.dataset;
    const dayId = state.activeDayId;
    const card = stepperBtn.closest(".card");
    const realName = card.querySelector(".ex-name").textContent;
    const bucket = target === "goal" ? state.goals[dayId] : state.logs[dayId].exercises;
    if (target === "log" && !bucket[realName]) bucket[realName] = emptyLog();
    const obj = target === "goal" ? (bucket[realName] = bucket[realName] || defaultGoal(findEx(dayId, realName))) : bucket[realName];
    const cur = obj[field] === null || obj[field] === undefined || obj[field] === "" ? 0 : Number(obj[field]);
    let next;
    if (steps) {
      next = nextStepValue(JSON.parse(steps), cur, Number(dir));
    } else {
      next = Math.max(Number(min), cur + Number(step) * Number(dir));
    }
    obj[field] = next;
    const valEl = document.getElementById(`val-${target}-${field}-${s}`);
    if (valEl) valEl.textContent = `${next} ${suffix}`;
    if (target === "goal") {
      saveGoal(dayId, realName, obj);
      if (field === "weight" && isFirstWeightedExercise(dayId, realName)) {
        const rampEl = document.getElementById(`warmup-ramp-${s}`);
        if (rampEl) {
          rampEl.innerHTML = `<span class="warmup-ramp-label">Warm-Up Ramp</span>${renderWarmupRampHtml(next)}`;
        }
      }
    }
    else persistSession();
    return;
  }
});

app.addEventListener("change", (e) => {
  const dateInput = e.target.closest('[data-action="change-date"]');
  if (dateInput) {
    state.dates[state.activeDayId] = snapToWeekday(dateInput.value, state.activeDayId);
    loadDayData(state.activeDayId);
    renderApp();
    return;
  }
  const cycleInput = e.target.closest('[data-action="change-cycle-start"]');
  if (cycleInput) {
    state.cycleStart = mondayOf(cycleInput.value);
    saveCycleStart(state.cycleStart);
    renderApp();
    return;
  }
  const select = e.target.closest("select[data-field]");
  if (select) {
    const { target, field } = select.dataset;
    const dayId = state.activeDayId;
    const card = select.closest(".card");
    const realName = card.querySelector(".ex-name").textContent;
    if (target === "goal") {
      const obj = (state.goals[dayId][realName] = state.goals[dayId][realName] || defaultGoal(findEx(dayId, realName)));
      obj[field] = select.value || null;
      saveGoal(dayId, realName, obj);
    } else {
      const obj = (state.logs[dayId].exercises[realName] = state.logs[dayId].exercises[realName] || emptyLog());
      obj[field] = select.value;
      persistSession();
    }
  }
});

app.addEventListener("input", (e) => {
  const field = e.target.closest("input[data-field], textarea[data-field]");
  if (!field) return;
  const { fieldName } = { fieldName: field.dataset.field };
  const dayId = state.activeDayId;
  if (fieldName === "sessionNotes") {
    state.logs[dayId].sessionNotes = field.value;
    persistSession();
    return;
  }
  const card = field.closest(".card");
  const realName = card.querySelector(".ex-name").textContent;
  const obj = (state.logs[dayId].exercises[realName] = state.logs[dayId].exercises[realName] || emptyLog());
  obj[fieldName] = field.value;
  persistSession();
});

/* ================================================================== */
/* INIT                                                                 */
/* ================================================================== */
loadDayData(state.activeDayId);
computeAllStreaks();
renderApp();
document.addEventListener("pointerdown", unlockAudio, { once: true });
</script>
</body>
</html>
